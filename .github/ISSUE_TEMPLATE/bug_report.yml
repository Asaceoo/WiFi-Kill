name: Bug 报告
description: 程序行为与预期不符时使用。请尽量提供可复现步骤。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提问前请先确认：**该网络是你自己的，或你已获得书面授权。**
        本仓库不协助任何未经授权的网络干扰行为。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 一句话说清现象，不要只写「不能用」。
      placeholder: 点了「全阻断」后，界面显示阻断中，但目标手机仍能刷视频。
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 你期望发生什么
      placeholder: 目标应该立刻失去外网访问。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 WiFiKill，等扫描完成
        2. 选中 192.168.1.5
        3. 点「阻断选中」
        4. 在目标手机上打开 B 站
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 窗口右下角，或 exe 属性里的文件版本
      placeholder: v2.1.0
    validations:
      required: true

  - type: dropdown
    id: net
    attributes:
      label: 网络环境
      options:
        - 家庭 WiFi（单路由器）
        - 公司 / 酒店 / 公共 WiFi（可能开了客户端隔离）
        - 有线连接
        - 手机热点
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: ipv6
    attributes:
      label: 本网是否有 IPv6
      description: 看界面顶部有没有驼色条「本网已启用 IPv6」
      options:
        - 有驼色条（本网有 IPv6）
        - 没有驼色条
        - 不清楚
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 运行日志
      description: 复制界面底部的日志区，或运行 `WiFiKill.exe doctor` 的输出。
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我在自有或已获授权的网络上操作
          required: true
        - label: 已安装 Npcap 并勾选 WinPcap API-compatible Mode
          required: true
