name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # CI runner 的 Python 默认 stdout 是 cp1252，打印中文会 UnicodeEncodeError。
      # 强制 UTF-8 模式，确保测试与构建脚本的中文输出不崩溃。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验 tag 与 versions.json 一致
        shell: bash
        run: |
          set -e
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "非 tag 触发（${GITHUB_REF}），跳过版本一致性校验"
            exit 0
          fi
          APP=$(python -c "import json;print(json.load(open('versions.json',encoding='utf-8'))['app'])")
          echo "tag=${GITHUB_REF_NAME} versions.json app=${APP}"
          if [ "v${APP}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 versions.json 的 ${APP} 不一致 —— 产物名与 Release 标题会错配。请先 python build.py 并提交 versions.json 后再打 tag。"
            exit 1
          fi

      - name: 准备 Python（完整版，含 tkinter）
        # 说明：actions/setup-python 在 Windows 上使用的是 actions/python-versions
        # 预构建二进制，默认不含 tcl/tk，导致 build.py ensure_env() 的
        # "import tkinter" 检查失败。此处改用 python.org 官方安装包（自带 tkinter）。
        shell: pwsh
        run: |
          $ErrorActionPreference = "stop"
          $py = "3.12.7"
          $url = "https://www.python.org/ftp/python/$py/python-$py-amd64.exe"
          $installer = Join-Path $env:TEMP "python-$py.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet","InstallAllUsers=0","PrependPath=0","Include_tcltk=1","Include_test=0","Include_launcher=0" -Wait
          $pyDir = Join-Path $env:LOCALAPPDATA "Programs\Python\Python312"
          $pyDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $pythonExe = Join-Path $pyDir "python.exe"
          & $pythonExe --version
          & $pythonExe -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install scapy pyinstaller

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 验证解释器（含 scapy/tkinter）
        shell: pwsh
        run: |
          python -c "import sys, scapy, tkinter; print('python =', sys.executable); print('scapy =', scapy.__version__)"

      - name: 单元测试-边界
        shell: bash
        run: |
          set -e
          python tests/test_edge.py

      - name: 单元测试-IPv6
        shell: bash
        run: |
          set -e
          python tests/test_ipv6.py

      - name: 单元测试-本机守护
        shell: bash
        run: |
          set -e
          python tests/test_guard.py

      - name: 单元测试-全网哨兵
        shell: bash
        run: |
          set -e
          python tests/test_sentinel.py

      - name: 单元测试-占空比限速
        shell: bash
        run: |
          set -e
          python tests/test_throttle.py

      - name: 构建三种产物
        run: python build.py --no-bump

      - name: 列出产物
        run: Get-ChildItem dist | Format-Table Name,Length
        shell: pwsh

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: WiFiKill ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 本版重点（${{ github.ref_name }}）

            **对抗性审查第 5–6 轮 · 三份文档重写 · 发布链加固 · 测试 148 项**

            ### 🔧 实现者视角（实现正确性）

            - **发送失败不回滚队列**：`Killer.add()` 首发失败时目标仍留在队列，投毒线程照样打它，
              而界面已记成「跳过」。现在失败即出队、不落状态。
            - **状态文件坏记录掀翻恢复链**：恢复流程直接取 `it["ip"]`，缺字段即 `KeyError`，
              而它跑在工作线程里 —— 用户只看到「点了没反应」。解析下沉 `core.state_targets()`。
            - **损坏的哨兵基线每次扫描都炸**：`known` 被写成 list 时 `feed_scan()` 抛
              `AttributeError`。现在按空基线自愈。

            ### 🛡️ 审查者视角（不变量与失控面）

            - **换网后继续打旧网关**：`Killer` 持有旧 `NetInfo` 快照，换 Wi-Fi 后帧仍发向旧网关 MAC
              —— 界面「阻断中」，目标照常上网。新增 `matches_network()` / `abandon()`，扫描后比对即中止。
            - **只剩 IPv6 目标时「全部放行」被判死**：按钮与放行入口只看 IPv4 队列，
              IPv6 阻断只能靠退出程序停止。现已把 IPv6 目标一并计入。
            - **逐台放行谎报成功**：恢复帧发不出去时不再静默，明确报 err。

            ### 📚 AI 使用方视角（诚实性）

            - IPv6 横幅「同时仅支持 1 台目标」过期（v2.4.0 起多目标并发）→ 已改正。
            - 哨兵面板只渲染前 6 台待认领 → 改为完整可滚动列表 + 选中认领/移出 + 全部认领。

            ### 📦 第 6 轮 · 发布链与文档

            - **三份文档重写**：README（概念图 + 用法/使用说明 + 20 个使用实例 + 免责声明）、
              `docs/USER_MANUAL.md`（教程 A–N + 故障排查表 + 卸载清理）、
              `docs/TECH_MANUAL.md`（报文/线程/状态机/护栏/测试/发布流水线）。
            - **版本同步加硬校验**：构建时校验 README 徽章、版本表与两份手册头部，
              格式漂移导致版本静默不同步时**直接中止构建**。
            - **打包版与安装包补概念图**：README 用相对路径引用图片，离线解压不再裂图。
            - **安装向导加免责声明页**（`LicenseFile`），必须勾选同意才能继续；
              卸载时清理全部运行时状态文件。
            - **CI 校验 tag 与 `versions.json` 一致**，不一致直接失败；删除历史调试步骤。
            - 移除被误提交的 PyInstaller 生成物 `WiFiKill.spec`（内含本机绝对路径）。

            ### 🌐 既有功能（全部保留并回归）

            - 占空比限速（80/50/20% 四档）、全网 ARP 哨兵（新设备告警/投毒者指认/事件流）、
              Guard 本机缓存自愈、IPv6 多目标并发、网络切换重估、托盘通知。

            ### 🔬 验证

            - 无头：**边界 52 + IPv6 58 + 守护 21 + 哨兵 11 + 限速 6 = 148 项** 全绿
            - 真机：`selftest.py` **51 项 0 失败**（真实 GUI + 幽灵设备端到端）

            ## 三种形态，按需选择

            | 形态 | 文件 | 说明 |
            |---|---|---|
            | **安装版** | `WiFiKill-${{ github.ref_name }}-setup.exe` | 中文安装向导，带开始菜单/桌面快捷方式与卸载 |
            | **单文件版** | `WiFiKill-${{ github.ref_name }}.exe` | 绿色单文件，拷走即用 |
            | **打包版** | `WiFiKill-${{ github.ref_name }}-portable.zip` | exe + 用户手册 + 技术手册 + 许可 |

            另附：`README.md`、`docs/USER_MANUAL.md`、`docs/TECH_MANUAL.md` 为最新版本文档。

            ## 安装前必读

            1. 先装 [Npcap](https://npcap.com/#download)，安装时**务必勾选 `WinPcap API-compatible Mode`**
            2. 单文件版/打包版请放在可写目录（不要放 `C:\Program Files`）
            3. 首次启动会解包，约 2–3 秒属正常

            ## ⚠️ 免责声明

            本工具仅用于自有网络或已获书面授权的安全测试、教学演示。
            未经授权干扰他人网络通信可能违反《网络安全法》第二十七条、
            《治安管理处罚法》第二十九条，情节严重可触犯《刑法》第二百八十五条、第二百八十六条。
            **作者不对任何滥用行为承担责任。**
          files: |
            dist/WiFiKill-v*-setup.exe
            dist/WiFiKill-v*.exe
            dist/WiFiKill-v*-portable.zip
            README.md
            docs/USER_MANUAL.md
            docs/TECH_MANUAL.md

      - name: 保留构建产物（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WiFiKill-build
          path: dist/*
          retention-days: 7
