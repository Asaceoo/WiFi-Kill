name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # CI runner 的 Python 默认 stdout 是 cp1252，打印中文会 UnicodeEncodeError。
      # 强制 UTF-8 模式，确保测试与构建脚本的中文输出不崩溃。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 Python（完整版，含 tkinter）
        # 说明：actions/setup-python 在 Windows 上使用的是 actions/python-versions
        # 预构建二进制，默认不含 tcl/tk，导致 build.py ensure_env() 的
        # "import tkinter" 检查失败。此处改用 python.org 官方安装包（自带 tkinter）。
        shell: pwsh
        run: |
          $ErrorActionPreference = "stop"
          $py = "3.12.7"
          $url = "https://www.python.org/ftp/python/$py/python-$py-amd64.exe"
          $installer = Join-Path $env:TEMP "python-$py.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet","InstallAllUsers=0","PrependPath=0","Include_tcltk=1","Include_test=0","Include_launcher=0" -Wait
          $pyDir = Join-Path $env:LOCALAPPDATA "Programs\Python\Python312"
          $pyDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $pythonExe = Join-Path $pyDir "python.exe"
          & $pythonExe --version
          & $pythonExe -c "import tkinter; print('tkinter OK:', tkinter.TkVersion)"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install scapy pyinstaller

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 验证解释器（含 scapy/tkinter）
        shell: pwsh
        run: |
          python -c "import sys, scapy, tkinter; print('python =', sys.executable); print('scapy =', scapy.__version__)"

      - name: 单元测试-边界
        shell: bash
        run: |
          set -e
          python tests/test_edge.py

      - name: 单元测试-IPv6
        shell: bash
        run: |
          set -e
          python tests/test_ipv6.py

      - name: 单元测试-本机守护
        shell: bash
        run: |
          set -e
          python tests/test_guard.py

      - name: 单元测试-全网哨兵
        shell: bash
        run: |
          set -e
          python tests/test_sentinel.py

      - name: 诊断-回传测试失败详情
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "===== 环境 ====="
            python -c "import sys, scapy, tkinter; print('python', sys.executable, sys.version); print('scapy', scapy.__version__)"
            echo "----- arp -a -----"
            arp -a 2>&1 | head -30
            echo "----- t_bad_cidr 直接复现 -----"
            python -c "import core; ni=core.NetInfo(iface='test0',my_ip='10.0.0.2',my_mac='aa:bb:cc:dd:ee:01',gateway_ip='10.0.0.1',gateway_mac='aa:bb:cc:dd:ee:02',cidr='not-a-cidr',iface_name='Test IF'); print(core.scan(ni,0.3,active=False))"
            echo "===== test_edge 全量输出 ====="
            python tests/test_edge.py 2>&1
            echo "edge_exit=$?"
            echo "===== test_ipv6 全量输出 ====="
            python tests/test_ipv6.py 2>&1
            echo "ipv6_exit=$?"
            echo "===== test_guard 全量输出 ====="
            python tests/test_guard.py 2>&1
            echo "guard_exit=$?"
            echo "===== test_sentinel 全量输出 ====="
            python tests/test_sentinel.py 2>&1
            echo "sentinel_exit=$?"
          } > ci-diag.txt
          FNAME="ci-diag-${{ github.run_id }}.txt"
          B64=$(base64 -w0 ci-diag.txt 2>/dev/null || base64 ci-diag.txt | tr -d '\n')
          BASE_SHA=$(git rev-parse HEAD)
          # 先创建 ci-diag 分支（contents API 不能创建分支，只能提交到已存在分支）
          REF_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Asaceoo/WiFi-Kill/git/refs" \
            -d "{\"ref\":\"refs/heads/ci-diag\",\"sha\":\"${BASE_SHA}\"}")
          # 提交诊断文件到 ci-diag 分支
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Asaceoo/WiFi-Kill/contents/${FNAME}" \
            -d "{\"message\":\"ci diag run ${{ github.run_id }}\",\"content\":\"${B64}\",\"branch\":\"ci-diag\"}")
          echo "create_ref_http=$REF_HTTP commit_http=$HTTP file=${FNAME}"

      - name: 构建三种产物
        run: python build.py --no-bump

      - name: 列出产物
        run: Get-ChildItem dist | Format-Table Name,Length
        shell: pwsh

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: WiFiKill ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 本版重点（${{ github.ref_name }}）

            **全网 ARP 哨兵 · 设备基线库 · 投毒者指认 · 托盘气泡通知 · 测试 123 项**

            ### 🛡️ 全网 ARP 哨兵（Sentinel）· 本版核心

            - **设备基线库**：首次运行把扫描到的设备静默记入「全网名册」；
              之后**新设备上线立即告警**（托盘气泡 + 事件流），人工认领入册 / 移出。
            - **投毒者指认**：守护检测到网关映射漂移并自动纠正后，启动短嗅探抓取
              「冒称网关 IP」的帧，**定位攻击者的真实 MAC** 并记录在案；抓不到则如实说明。
            - **事件流**：新设备 / 认领 / 移出 / 投毒指认全记录（最近 200 条，落盘持久化）。
            - **哨兵面板**：设置 →「哨兵事件…」，待认领设备一键认领，历史可查。

            ### 🔔 托盘气泡通知

            - 新设备上线、ARP 投毒已拦截等关键事件即时弹 Windows 通知，
              **同一事件 5 分钟内只弹一次**，持续攻击不轰炸。

            ### 🔬 延续 v2.4.x 的对抗性审查成果

            - Guard 本机缓存自愈（`arp -d` 删除脏条目由真实网关重建）、IPv6 护栏
              结构化校验、动画代数令牌、恢复逻辑网络一致性校验，全部保留并回归验证。

            ### 🔬 验证

            - 无头：**边界 34 项 + IPv6 报文 58 项 + 守护 21 项 + 哨兵 10 项 = 123 项** 全绿
            - 真机：`selftest.py` 43 项 0 失败（真实 GUI + 幽灵设备端到端；
              哨兵基线/事件流/面板链路真机自检）

            ## 三种形态，按需选择

            | 形态 | 文件 | 说明 |
            |---|---|---|
            | **安装版** | `WiFiKill-${{ github.ref_name }}-setup.exe` | 中文安装向导，带开始菜单/桌面快捷方式与卸载 |
            | **单文件版** | `WiFiKill-${{ github.ref_name }}.exe` | 绿色单文件，拷走即用 |
            | **打包版** | `WiFiKill-${{ github.ref_name }}-portable.zip` | exe + 用户手册 + 技术手册 + 许可 |

            另附：`README.md`、`docs/USER_MANUAL.md`、`docs/TECH_MANUAL.md` 为最新版本文档。

            ## 安装前必读

            1. 先装 [Npcap](https://npcap.com/#download)，安装时**务必勾选 `WinPcap API-compatible Mode`**
            2. 单文件版/打包版请放在可写目录（不要放 `C:\Program Files`）
            3. 首次启动会解包，约 2–3 秒属正常

            ## ⚠️ 免责声明

            本工具仅用于自有网络或已获书面授权的安全测试、教学演示。
            未经授权干扰他人网络通信可能违反《网络安全法》第二十七条、
            《治安管理处罚法》第二十九条，情节严重可触犯《刑法》第二百八十五条、第二百八十六条。
            **作者不对任何滥用行为承担责任。**
          files: |
            dist/WiFiKill-v*-setup.exe
            dist/WiFiKill-v*.exe
            dist/WiFiKill-v*-portable.zip
            README.md
            docs/USER_MANUAL.md
            docs/TECH_MANUAL.md

      - name: 保留构建产物（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WiFiKill-build
          path: dist/*
          retention-days: 7
